aid: hyperlight
name: HyperLight
description: 'HyperLight Corporation is a Cambridge, Massachusetts photonics company founded
  by Mian Zhang out of Harvard University that designs and manufactures thin-film lithium
  niobate (TFLN) photonic integrated circuits. Its patented TFLN Chiplet platform pairs the
  electro-optic properties of thin-film lithium niobate with CMOS-like, high-volume wafer
  fabrication to produce IMDD transmitter PICs at up to 448 Gbps per lane, dual-polarization
  IQ transmitter PICs for 130/200/260 Gbaud coherent links, and packaged standalone modulators
  with up to 145 GHz bandwidth, aimed at AI and hyperscale data center interconnect, DCI and
  telecom transport, test and measurement, and emerging quantum and sensing applications. The
  company manufactures through tier-1 foundry and OSAT partners including UMC and its compound
  semiconductor subsidiary Wavetek on 6-inch and 8-inch wafers, is ISO 9001:2015 certified as
  of September 2025, and raised an $80M Series C led by MediaTek with participation from UMC
  Capital, Jabil, Foxconn, EDBI, CDIB-TEN Capital and the Qatar Investment Authority, following
  a $37M Series B in September 2024. HyperLight is a semiconductor hardware business: its public
  site covers company, applications, custom development, three product lines, patents, careers
  and a sales contact, and it publishes no developer program, API, SDK, webhook surface or
  machine-readable specification of any kind.'
